<svg width="1000" height="676" viewBox="0 0 1000 676" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hey, I'm Ricardo. Computer Science and Engineering student at ITMO University. Aspiring backend developer: Java, Spring Boot, PostgreSQL. Angola to Russia.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="676" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="0.55" stop-color="#0c0c0d"/>
      <stop offset="1" stop-color="#08090a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 676) rotate(180) scale(620 380)">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="676" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="676" fill="url(#bg)"/>
    <rect width="1000" height="676" fill="url(#grid)"/>
    <rect width="1000" height="676" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="675" rx="25.5" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- status pill -->
  <rect x="36" y="36" width="372" height="38" rx="19" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle class="pulse" cx="60" cy="55" r="5" fill="#10b981"/>
  <text class="mono" x="78" y="60" font-size="14" fill="#d4d4d8">open to internships · Saint Petersburg</text>

  <!-- headline -->
  <text class="sans" x="36" y="150" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Hey, I'm Ricardo.</text>

  <!-- prompt -->
  <text class="mono" x="36" y="208" font-size="24" fill="#71717a">~</text>
  <text class="mono" x="62" y="208" font-size="24" font-weight="700" fill="#10b981">&gt;</text>
  <text class="mono" x="92" y="208" font-size="24" fill="#f4f4f5">building reliable backend systems</text>

  <!-- terminal window -->
  <rect x="652" y="40" width="312" height="200" rx="16" fill="#141516" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="678" cy="65" r="6" fill="#ef4444"/>
  <circle cx="700" cy="65" r="6" fill="#f59e0b"/>
  <circle cx="722" cy="65" r="6" fill="#10b981"/>
  <text class="mono" x="940" y="70" font-size="13" fill="#71717a" text-anchor="end">~/stack</text>
  <line x1="652" y1="86" x2="964" y2="86" stroke="#ffffff" stroke-opacity="0.08"/>

  <circle class="pulse" cx="682" cy="114" r="5" fill="#10b981"/>
  <text class="mono" x="702" y="119" font-size="18" fill="#e4e4e7">java</text>
  <circle cx="682" cy="148" r="5" fill="#10b981"/>
  <text class="mono" x="702" y="153" font-size="18" fill="#e4e4e7">spring-boot</text>
  <circle cx="682" cy="182" r="5" fill="#10b981"/>
  <text class="mono" x="702" y="187" font-size="18" fill="#e4e4e7">postgresql</text>
  <circle cx="682" cy="216" r="5" fill="#10b981"/>
  <text class="mono" x="702" y="221" font-size="18" fill="#e4e4e7">docker</text>

  <!-- divider -->
  <line x1="36" y1="268" x2="964" y2="268" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- about -->
  <text class="sans" x="36" y="308" font-size="24" font-weight="700" fill="#ffffff">Computer Science &amp; Engineering Student @ ITMO University</text>
  <text class="sans" x="36" y="344" font-size="21" font-weight="600" fill="#a7f3d0">Aspiring Backend Developer | Java • Spring Boot • PostgreSQL</text>

  <text class="sans" x="36" y="388" font-size="16" fill="#a1a1aa">I'm a Computer Science and Engineering student at ITMO University, focused on building reliable</text>
  <text class="sans" x="36" y="412" font-size="16" fill="#a1a1aa">backend applications and improving my software engineering skills.</text>

  <text class="mono" x="36" y="448" font-size="16" fill="#71717a">Angola → Russia</text>

  <!-- divider -->
  <line x1="36" y1="474" x2="964" y2="474" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- tech stack -->
  <text class="mono" x="36" y="506" font-size="14" font-weight="700" fill="#10b981" letter-spacing="2">TECH STACK</text>

  <g class="mono" font-size="14" fill="#e4e4e7" text-anchor="middle">
    <rect x="36"  y="520" width="62"  height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="67"  y="541">Java</text>
    <rect x="108" y="520" width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="168" y="541">Spring Boot</text>
    <rect x="238" y="520" width="112" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="294" y="541">PostgreSQL</text>
    <rect x="360" y="520" width="78"  height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="399" y="541">Python</text>
    <rect x="448" y="520" width="53"  height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="474" y="541">Git</text>
    <rect x="511" y="520" width="78"  height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="550" y="541">GitHub</text>
    <rect x="599" y="520" width="137" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="667" y="541">IntelliJ IDEA</text>
    <rect x="746" y="520" width="87"  height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="789" y="541">VS Code</text>
    <rect x="843" y="520" width="78"  height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="882" y="541">Docker</text>
  </g>

  <!-- categories -->
  <text class="mono" x="36" y="592" font-size="15" fill="#d4d4d8"><tspan font-weight="700" fill="#10b981">Backend:</tspan> Java, Spring Boot, REST APIs, Spring Data JPA</text>
  <text class="mono" x="36" y="618" font-size="15" fill="#d4d4d8"><tspan font-weight="700" fill="#10b981">Database:</tspan> PostgreSQL, SQL, Database Design</text>
  <text class="mono" x="36" y="644" font-size="15" fill="#d4d4d8"><tspan font-weight="700" fill="#10b981">Tools:</tspan> Git, GitHub, Docker, IntelliJ IDEA</text>

  <text class="mono" x="964" y="644" font-size="15" fill="#71717a" text-anchor="end">github.com/Ricardo0706</text>
</svg>
